<style>
  /* Розкладка: просто нічне тло; власний код анімації друкується на весь екран, як у редакторі, і поволі
     їде вгору; літери цього коду зупиняються там, де буде метелик, і стають його фразами. Далі метелик оживає
     й відлітає, а код народжує ще кількох: вони літають разом над кодом. */
  :root {
    /* палітра трійками r g b — її читає й скрипт */
    --c-night: 2 4 11;
    --c-mid: 5 10 30;
    --c-electric: 30 116 255;
    --c-ice: 142 216 255;
    --c-flash: 228 246 255;
    --c-violet: 136 104 255;

    /* інтерфейс */
    --night: rgb(var(--c-night));
    --ink: rgb(226 241 255);
    --dim: rgb(112 140 192);

    /* редактор: одна синя родина відтінків */
    --code-text: rgb(132 158 210);
    --code-gutter: rgb(58 74 118);
    --code-key: rgb(var(--c-violet));
    --code-fn: rgb(var(--c-ice));
    --code-str: rgb(196 224 255);
    --code-num: rgb(98 160 255);
    --code-com: rgb(84 104 150);
    --code-size: clamp(9.5px, min(2.7vw, 2.5vh), 13px);

    /* власний код фігур: ті самі кольори синтаксису, лише засвічені (трійки, малюються на полотні) */
    --h-str: 236 246 255;
    --h-key: 182 164 255;
    --h-fn: 160 226 255;
    --h-num: 132 188 255;
    --h-punct: 140 168 230;
    --h-name: 178 204 248;
    --h-com: 150 170 218;

    --font-ui: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .sky {   /* за фігурами жодного світла: лише ніч, трохи світліша вгорі */
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgb(var(--c-mid)) 0%, rgb(var(--c-night)) 75%);
    pointer-events: none;
  }

  /* редактор — під усім і довкола */
  .editor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.8;
    font: 500 var(--code-size)/1.6 var(--font-ui);
    color: var(--code-text);
  }
  .tab {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    left: max(16px, env(safe-area-inset-left, 0px));
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--dim);
  }
  .tab i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgb(var(--c-ice));
    box-shadow: 0 0 8px rgb(var(--c-electric));
  }
  .viewport {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 60px);
    bottom: 0;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .code { will-change: transform; }   /* його веде скрипт, тож метелик завжди знає, де кожна літера */
  .ln { display: flex; height: 1.6em; white-space: pre; }
  .no {
    flex: none;
    width: 3ch;
    margin-right: 1.5ch;
    text-align: right;
    color: var(--code-gutter);
    font-variant-numeric: tabular-nums;
  }
  .tx { display: inline-block; overflow: hidden; white-space: pre; vertical-align: top; flex: none; }
  .caret {
    display: inline-block;
    flex: none;
    width: 0.55ch;
    height: 1.15em;
    margin-top: 0.22em;
    background: var(--code-fn);
    box-shadow: 0 0 6px rgb(var(--c-electric));
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .k { color: var(--code-key); }
  .f { color: var(--code-fn); }
  .s { color: var(--code-str); }
  .n { color: var(--code-num); }
  .c { color: var(--code-com); }

  #stage {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .sign {   /* підпис автора: над полотном, дотиків не перехоплює */
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    white-space: pre;
    font: 500 var(--code-size)/1.6 var(--font-ui);
    color: var(--dim);
  }
  .sign b { font-weight: 500; color: rgb(var(--h-name)); }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }
</style>
</head>

  <div class="viewport"><div class="code" id="code"></div></div>
</div>

<script>

    for (const x of scanPoly(P, y).flat()) if (best === null || Math.abs(x - near) < Math.abs(best - near)) best = x;

      R.kind = kind;

  // метелик із рядків: тіло, по клітинці повітря обабіч, два крила; v — пропорції крил
  function wingRows(O, v, pal) {

    const body = carve(raster(bd, Y0), taken);   // тіло: кільця з дужок

    const right = carve(raster(wr, Y0), taken), left = carve(raster(wl, Y0), taken);

  // нові метелики: у кожного свій відтінок і свої родини мов
  const MATES = [
    { pal: 1, kin: [2, 4] },       // рожевий: романські мови, грецька, албанська
    { pal: 2, kin: [8, 9, 10] },   // золотий: Азія й Африка
    { pal: 3, kin: [1, 11] },      // крижаний: германські й кельтські мови, баскська
    { pal: 4, kin: [6, 7] },       // м'ятний: Кавказ, Близький Схід, Індія
    { pal: 5, kin: [3, 5] },       // кораловий: угро-фінські, балтійські, тюркські
    { pal: 6, kin: [0] },          // бузковий: слов'янські
  ];
  function mate(i) {
    const m = MATES[i % MATES.length];
    return {
      rows: [], M: { B: ident(), L: ident(), R: ident() }, k: 0, a: 0, cache: null, fl: flyer(), pal: m.pal, kin: m.kin,
      kind: KINDS[(i + 1) % KINDS.length], i, at: Infinity, t0: Infinity, mode: 'wait', built: false, baked: false,

  }
  // його фрази: передусім своїх родин і не більше, ніж лишилося на нього; решта клітинок — дрібний код
  function buildMate(F) {
    const left = FLOCK.filter(G => !G.built).length;
    F.rows = wingRows(F, F.kind, F.pal);
    PREFER = new Set(F.kin);
    capNow = heldN + Math.max(3, Math.floor((CAP - 8 - heldN) / Math.max(1, left)));
    for (const R of shuffle(F.rows.slice())) R.pieces = piecesFor(R, R.part !== 'B');
    PREFER = null;
    capNow = Infinity;
    for (const R of F.rows) { compileRow(R); R.any = true; }

    F.cache = null;
  }
  function bakeMate(F, t) {   // його рядки малюються потроху, по кілька за кадр, і складаються в готові полотна
    const rs = F.rows;
    bakeSteps(F, false, parts => { if (F.rows === rs) { F.cache = parts; F.baked = true; } })
      .forEach((step, i) => later(t + i * 1e-4, () => { if (F.rows === rs) step(); }));

  function layout(mode) {

    const cap = CAP - 30, cells = BF.rows.reduce((s, R) => s + R.n, 0);

    for (const R of shuffle(BF.rows.slice())) R.pieces = piecesFor(R, R.part !== 'B');

      const ph = [];

      for (const [R, i] of shuffle(ph).slice(0, heldN - cap)) {

        R.pending = 0;

          R.act[i] = rand(2, 58);   // секунди від початку руху коду: метелик росте поволі, а не з'являється

  /* ---------- народження: літери коду, що пропливає, зупиняються там, де буде метелик ---------- */
  let GR0 = 0, GR1 = 0;

      for (let i = 0; i < R.n && budget > 0; i++) {

          const C = ED.list[kRow + ((d0 + s) % 6)];

  const WORDCH = /[\p{L}\p{N}_$]/u;

  function liftWord(R, i, t, L) {

    const ok = c => c >= 0 && c < L.vis && L.cps[c] !== ' ' && c - R.ec0 >= 0 && c - R.ec0 < R.n && R.rev[c - R.ec0] === Infinity;
    const word = c => WORDCH.test(L.cps[c]);
    let a = ec, b = ec + 1;
    if (word(ec)) {
      const max = Math.random() < 0.3 ? 18 : 10;
      while (b - a < max) {
        if (ok(a - 1) && word(a - 1)) a--;
        else if (ok(b) && word(b)) b++;
        else if (max > 10 && L.cps[b] === ' ' && ok(b + 1) && word(b + 1)) b += 2;   // через пробіл: уже фраза
        else break;
      }
    }

    for (let c = a; c < b; c++) {

  function lift(R, j, L, c, t0, tLift, tArr, hold, turn) {
    lifters.push({ u: L.cps[c], cls: L.cls[c], L, c, t0, tLift, tArr, x1: cx + (R.k0 + j + 0.5) * CW, y1: cy + R.y - CH / 2 });

      if (R.rev[k] !== Infinity) continue;

      R.ccl[k] = k === j ? L.cls[c] : 0;
      R.rev[k] = tArr;
      R.mid[k] = k === j ? tArr + hold : tArr;

    R.dirty = true;

  // над цією клітинкою давно не пропливало нічого з коду: до неї перелітає найближча літера
  function pull(R, i, t) {

    let best = null, bd = Infinity;
    for (let dk = -14; dk <= 14; dk++) {

      if (!L || !L.vis || dy >= bd) continue;
      const top = ED.top0 + (k0 + dk) * CH + ED.y;
      if (top < ED.top0 - CH || top > H) continue;
      const near = clamp(ec, 0, L.vis - 1);   // метелик ширший за рядок коду: тоді шукаємо з краю цього рядка
      for (let c = Math.max(0, near - 30); c < Math.min(L.vis, near + 31); c++) {

  /* ---------- код змінюється: перебір, переписування, розсип ---------- */
  function unify(R, i0, i1) {   // група починає з першої клітинки, а перебирається й стає на місце з останньою
    const { grp, rev, mid, dec } = R;
    while (i0 > 0 && grp[i0] >= 0 && grp[i0 - 1] === grp[i0]) i0--;

  function keepPrev(R, t) {   // тримаємо те, що зараз на екрані, для клітинок, які ще не почали змінюватися
    if (R.prev && t < R.prevUntil) return;

    R.prev = R.base;

  // кілька шматків рядка поспіль стають одним новим: його букви перебираються зліва направо
  function decodeSpan(R, a, b, np, t) {

    setBase(R);
    const c0 = np.c0;

      R.rev[i] = R.mid[i] = t + 0.02 * k + rand(0, 0.03);
      R.dec[i] = R.rev[i] + rand(0.35, 0.6) + 0.012 * k;

      if (R.dec[i] > end) end = R.dec[i];

  // цілий рядок фігури перебирається в новий код, зліва направо
  function rewriteRow(R, t, pieces) {

    letGo(R.pieces, t, REST);
    R.pieces = pieces;
    compileRow(R);
    setBase(R);
    for (let i = 0; i < R.n; i++) {
      if (old[i] === ' ' && R.ch[i] === ' ') continue;
      if (RM) R.rev[i] = R.mid[i] = R.dec[i] = t;
      else {
        R.rev[i] = R.mid[i] = t + 0.008 * i + rand(0, 0.04);
        R.dec[i] = R.rev[i] + rand(0.35, 0.65);

    unify(R, 0, R.n);

  function renew(R, t, build) {   // рядок пишеться наново: спершу відпускає свої фрази, тож новим є місце
    letGo(R.pieces, t, REST);

    let k = -1;

  // перший метелик малюється рядок за рядком, поки народжується і поки він поруч; у польоті — з готових полотен
  const liveBF = () => formedAt < 0 || BF.mode === 'home' || BF.mode === 'rest' || !BF.cache;
  // код під пальцем: літери першого метелика розсипаються й повертаються, хоч як він повернутий
  function scramble(X, Y, rad, t, prob) {

      for (let i = i0; i < i1; i++) {
        if (R.rev[i] > R.prevUntil) R.prevUntil = R.rev[i];
        if (R.dec[i] > R.until) R.until = R.dec[i];
      }
      R.dirty = true;
    }
  }

  /* ---------- тихі слова ---------- */
  // зрідка, на подиху, складаються в одному рядку крила першого метелика, коли він повернувся й відпочиває;
  // кілька секунд — і на їхньому місці вже якась інша фраза
  function noteStep(t) {
    if (formedAt < 0) return;
    if (note) {
      if (t < note.until) return;
      const { R, pc, bare } = note;
      note = null;
      nextNote = t + rand(40, 80);
      later(t, now => {
        if (!R.pieces.includes(pc)) return;
        if (bare) { renew(R, now, () => piecesFor(R, true)); return; }   // рядок знову з обрисом і фразами
        const pi = takePhrase(i => canFit(cellsOf(PH[i]) + 2, pc.len), now);
        decodeInto(R, pc, pi >= 0 ? fitPiece(pi, pc.len) : codePiece(pc.len), now);
      });
      return;
    }
    if (t < nextNote || breathT < 0 || t > breathT + 0.2 || host(t) !== BF) return;   // лише на подиху, як і всі зміни
    nextNote = t + 4;   // зараз нема де: ще раз за мить
    placeNote(t);
  }

  // на вузькому крилі (телефон) тихі слова займають увесь рядок, без лапок і обрису: їм вистачає 17 клітинок
  function placeBare(t) {
    const need = cellsOf(MSG);
    const opts = BF.rows.filter(R => !R.hide && R.part !== 'B' && R.n >= need && R.pieces.every(pc => t >= (pc.busy || 0)));
    if (!opts.length) return false;
    opts.sort((p, q) => p.n - q.n);
    const R = opts[(Math.random() * Math.min(3, opts.length)) | 0], lead = (R.n - need) >> 1;
    const np = { parts: [[' '.repeat(lead) + MSG + ' '.repeat(R.n - need - lead), 1]], len: R.n, pi: NOTE };
    for (const pc of R.pieces) pc.busy = t + 3;
    const me = { R, pc: np, until: Infinity, bare: true };
    note = me;
    later(t, now => {
      if (note !== me) return;
      let end = decodeSpan(R, 0, R.pieces.length, np, now);
      if (!RM) {
        for (let c = np.c0 + lead + MSG.lastIndexOf(' ') + 1, k = 0; c < np.c0 + lead + need; c++, k++) {   // ім'я — останнім
          R.dec[c] = R.mid[c] + rand(1.3, 1.8) + 0.12 * k;
          end = Math.max(end, R.dec[c]);
        }
        R.until = Math.max(R.until, end);
        np.busy = end + 0.8;
      }
      me.until = end + rand(2.5, 4);   // лише кілька секунд цілою
    });
    return true;
  }

  /* ---------- літери, крізь які перебирається клітинка ---------- */
  const GLYPHS = Array.from('abcdefghijklmnopqrstuvwxyzабвгдеєжзиіїйклмнопрстуфхцчшщьюя0123456789{}()[];=+<>*');
  const NG = GLYPHS.length;
  let ATL = null;
  function makeAtlas() {   // кожна літера двічі, жирним: крижана, поки перебирається, і розпечена до білого перед тим, як стати
    const cols = 20, rws = Math.ceil(NG / cols), gp = Math.ceil(FS * 0.4);
    const gw = Math.ceil((CW + 2 * gp) * DPR), gh = Math.ceil((CH + 2 * gp) * DPR);
    const c = document.createElement('canvas');
    c.width = cols * gw;
    c.height = rws * gh * 2;
    const x = c.getContext('2d');
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.font = `700 ${(FS * DPR).toFixed(2)}px ${MONO}`;
    [FLASH, ICE].forEach((col, tint) => {
      x.fillStyle = css(col);
      x.shadowColor = css(ICE, 1, 0.7);
      x.shadowBlur = FS * 0.35 * DPR;
      GLYPHS.forEach((g, i) => x.fillText(g, ((i % cols) + 0.5) * gw, (tint * rws + ((i / cols) | 0) + 0.5) * gh));
    });
    ATL = { c, gw, gh, cols, rws };
  }
  function glyph(x, g, tint, X, Y) {   // одна літера з центром у пікселях пристрою X, Y
    const { gw, gh } = ATL;
    x.drawImage(ATL.c, (g % ATL.cols) * gw, (tint * ATL.rws + ((g / ATL.cols) | 0)) * gh, gw, gh,
      Math.round(X - gw / 2), Math.round(Y - gh / 2), gw, gh);
  }

  /* ---------- сюжет: секунди від миті, коли перший метелик цілий ---------- */
  // спершу він ледь дихає крилами; змахи частішають, і він злітає та меншає, бо летить углиб; тоді код народжує
  // ще кількох; вони літають разом, а перший час від часу повертається близько, відпочиває — і знову летить
  const T = { speed0: 9, speed1: 20, fly0: 17, hatch0: 23, gap: 5.5, home0: 64 };
  const since = t => (formedAt < 0 ? -1 : t - formedAt);
  const K_FAR = 0.15, K_NEAR = 0.42;   // масштаб далекого й близького: невеликі, щоб усім вистачало неба; ближче — лише зрідка
  const depthK = z => (z <= 1 ? lerp(K_FAR, K_NEAR, z) : lerp(K_NEAR, 1, (z - 1) / (Z_HOME - 1)));
  const flying = O => O.mode === 'fly' || O.mode === 'back';
  const outBack = x => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2;
  const HATCH = 1.9, UNFOLD = 1.5;   // скільки літери коду збігаються в точку народження і скільки новий розгортає крила

  // крила: змах — це кут, на який вони здіймаються; згори крило вужчає, як косинус цього кута
  function flap(O, dt) {
    const f = O.fl, u = since(clock);
    if (RM || (O === BF && u < 0)) return (f.c = 1);
    let P, A;
    if (O.mode === 'home') {   // перший, ще на місці: спершу ледь дихає, далі частіше й ширше — зараз злетить
      const s = smooth(T.speed0, T.speed1, u);
      P = lerp(1.6, 0.3, s);
      A = lerp(0.38 * smooth(0, 3, u), 1.18, s);
    } else if (O.mode === 'rest') {   // відпочиває: рідко й повільно, то ледь-ледь, то на всю ширину
      P = 3.2;
      A = f.restA;
    } else if (O.mode === 'hatch') {   // щойно народжений тріпоче, поки розгортає крила
      P = 0.34;
      A = 1;
    } else {   // у польоті: спокійні змахи; часто планерує на розкритих крилах; злякавшись — тріпоче
      P = lerp(lerp(0.62, 1.3, f.glide), 0.36, f.flutter);
      A = lerp(lerp(0.95, 0.16, f.glide), 1.08, f.flutter);
    }
    P /= 1 + 1.3 * arousal;   // дотик: тріпоче
    A = Math.max(A, 0.95 * arousal);
    const e = 1 - Math.exp(-dt * 5);
    f.P += (P - f.P) * e;
    f.A += (A - f.A) * e;
    const was = Math.floor(f.ph);
    f.ph += dt / f.P;
    if (O.mode === 'rest' && Math.floor(f.ph) !== was) f.restA = Math.random() < 0.35 ? rand(0.55, 0.95) : rand(0.04, 0.18);
    return (f.c = Math.max(0.1, Math.cos(f.A * (0.5 - 0.5 * Math.cos(TAU * f.ph)))));
  }

  // поки перший відпочиває близько, його місце вільне: решта облітають його довкола
  const homeBusy = () => BF.mode === 'rest' || BF.mode === 'back';
  // наскільки точка (x, y) далеко від першого, що відпочиває: 1 — край, далі якого метелик розміру k його вже не заступає
  const inHome = (x, y, k) => Math.hypot((x - cx) / ((17 + 12 * k) * S), (y - cy - 1.5 * S) / ((14.5 + 10 * k) * S));
  // куди летіти далі: деінде на екрані, не надто близько до того, де він уже є; зрідка — зовсім близько до нас
  function nextWay(O, t) {
    const f = O.fl, mx = W * 0.12, my = H * 0.13, far = Math.min(W, H) * 0.32, calm = O !== BF && homeBusy();
    const near = O !== BF && !calm && Math.random() < 0.14 && !FLOCK.some(G => G !== O && G.fl.wz > 1);
    f.wz = near ? rand(1.02, tall() ? 1.08 : 1.16) : Math.random() ** 0.85 * (calm ? 0.55 : 1);
    let ok = false;
    for (let k = 0; k < 16 && !ok; k++) {
      f.wx = rand(mx, W - mx);
      f.wy = rand(my + 40, H - my);
      ok = !(calm && inHome(f.wx, f.wy, depthK(f.wz)) < 1.1) && Math.hypot(f.wx - f.x, f.wy - f.y) > far;
    }
    if (!ok && calm) f.wy = H - my - rand(0, H * 0.1);   // на вузькому екрані — униз, під першого
    f.wUntil = t + rand(3.2, 6.5);
  }
  // куди тягне зараз: до своєї наступної точки, додому або на коло довкола затиснутого пальця
  function aim(O, t) {
    const f = O.fl;
    if (ptr.down && t - ptr.t0 > 0.35) {   // усі злітаються до пальця й кружляють довкола, кожен на своїй відстані
      const n = FLOCK.length + 1, i = O === BF ? 0 : O.i + 1, a = f.orb + (t - ptr.t0) * (0.75 + 0.2 * (i % 3));
      const r = Math.min(W, H) * (0.13 + (0.13 * i) / n);
      return { x: ptr.sx + Math.cos(a) * r, y: ptr.sy + Math.sin(a) * r * 0.7, z: 0.6 + 0.3 * Math.sin(a * 0.5 + i), pull: 2.4, damp: 2.2 };
    }
    if (O.mode === 'back') return { x: cx, y: cy, z: Z_HOME, pull: 1.3, damp: 2.4 };
    if (t > f.wUntil || Math.hypot(f.wx - f.x, f.wy - f.y) < Math.min(W, H) * 0.09) nextWay(O, t);
    const m = Math.min(W, H) * 0.07;   // і ще трохи петляє: метелики не літають по лінійці
    return { x: f.wx + m * Math.sin(f.q[0] * t + f.s[0]), y: f.wy + m * Math.sin(f.q[1] * t + f.s[1]), z: f.wz, pull: 1, damp: 1.25 };
  }
  // політ: пружина до цілі з обмеженою швидкістю, тож шлях складається з плавних дуг; ближчі на екрані швидші;
  // хилиться туди, куди летить; ніхто не налітає на сусіда, що на тій самій глибині
  function steer(O, t, dt) {
    const f = O.fl, g = aim(O, t), vmax = SPEED * (0.45 + 0.85 * f.k) * (1 + 0.7 * f.flutter);
    let ax = (g.x - f.x) * g.pull - f.vx * g.damp, ay = (g.y - f.y) * g.pull - f.vy * g.damp;
    for (const G of [BF, ...FLOCK]) {
      if (G === O || !flying(G) || Math.abs(G.fl.z - f.z) > 0.3) continue;
      const dx = f.x - G.fl.x, dy = f.y - G.fl.y, d = Math.hypot(dx, dy) || 1, near = 12 * S * (f.k + G.fl.k);
      if (d < near) { ax += (dx / d) * (near - d) * 5; ay += (dy / d) * (near - d) * 5; }
    }
    if (O !== BF && homeBusy() && !ptr.down) {
      const d = inHome(f.x, f.y, f.k);
      if (d < 1.05) {
        const dx = f.x - cx, dy = f.y - cy - 1.5 * S, l = Math.hypot(dx, dy) || 1, push = (1.05 - d) * SPEED * 9;
        ax += (dx / l) * push;
        ay += (dy / l) * push;
      }
      if (t > f.wUntil - 3 && inHome(f.wx, f.wy, depthK(f.wz)) < 1.1) nextWay(O, t);
    }
    const mx = W * 0.05, my = H * 0.07;   // краї екрана м'яко відштовхують
    if (f.x < mx) ax += (mx - f.x) * 6; else if (f.x > W - mx) ax -= (f.x - W + mx) * 6;
    if (f.y < my + 30) ay += (my + 30 - f.y) * 6; else if (f.y > H - my) ay -= (f.y - H + my) * 6;
    if (t >= f.nextGlide) {   // зрідка планерує кілька змахів поспіль
      f.glideOn = !f.glideOn && O.mode === 'fly';
      f.nextGlide = t + (f.glideOn ? rand(1.2, 2.4) : rand(2.5, 6));
    }
    f.glide += ((f.glideOn && !ptr.down ? 1 : 0) - f.glide) * (1 - Math.exp(-dt * 3));
    f.flutter = Math.max(0, f.flutter - dt * 0.7);
    ax *= 1 - 0.65 * f.glide;   // планерує: майже за інерцією, ледь знижуючись
    ay = ay * (1 - 0.65 * f.glide) + 16 * f.glide;
    f.vx += ax * dt;
    f.vy += ay * dt;
    const v = Math.hypot(f.vx, f.vy);
    if (v > vmax) { f.vx *= vmax / v; f.vy *= vmax / v; }
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vz += ((g.z - f.z) * 0.8 * g.pull - f.vz * 1.6) * dt;
    f.z = clamp(f.z + f.vz * dt, 0, Z_HOME);
    f.k = depthK(f.z);
    const tilt = clamp((f.vx / vmax) * 0.34 + (ax / (SPEED * 10)) * 0.5, -0.5, 0.5);
    f.rot += (tilt - f.rot) * (1 - Math.exp(-dt * 2.5));
  }
  // поза кожного метелика на цей кадр: де він, наскільки близько, як нахилений і як розкриті крила
  function pose(t, dt) {
    for (const O of [BF, ...FLOCK]) {
      if (O.mode === 'wait') continue;
      const f = O.fl, c = flap(O, dt);
      if (O === BF && (O.mode === 'home' || O.mode === 'rest' || formedAt < 0)) {   // на своєму місці, на сітці коду
        Object.assign(f, { x: cx, y: cy, z: Z_HOME, k: 1, rot: 0, vx: 0, vy: 0, vz: 0 });
        O.k = 1;
        trs(O.M.B, cx, cy, 0, 1);
      } else if (O.mode === 'egg' || O.mode === 'hatch') {   // народжується: росте з точки, розкручуючись
        const g = O.mode === 'egg' ? 0 : clamp((t - O.t0 - HATCH) / UNFOLD);
        f.y -= dt * 6 * g;
        O.k = f.k * outBack(g);
        O.a = smooth(0, 0.3, g);
        trs(O.M.B, f.x, f.y, (1 - smooth(0, 1, g)) * 0.7 * (O.i % 2 ? 1 : -1), Math.max(0.001, O.k));
      } else {
        if (!RM) steer(O, t, dt);
        O.k = f.k;
        O.a = Math.min(1, O.a + dt * 3);
        const bob = RM ? 0 : Math.sin(TAU * f.ph) * 0.45 * S * f.k * Math.min(1, f.A);   // кожен змах трохи підкидає
        trs(O.M.B, f.x, f.y - bob, f.rot, f.k);
      }
      about(O.M.B, 0, 0, 0, c, O.M.L);
      Object.assign(O.M.R, O.M.L);
    }
  }

  // перший метелик, поки він поруч і великий: у ньому дихають родини мов, переписуються рядки й бувають тихі слова
  function host(t) {
    const u = since(t);
    if (u < 0) return null;
    return (BF.mode === 'home' && (RM || u < T.fly0 - 1)) || BF.mode === 'rest' ? BF : null;
  }
  // родина цього подиху: що більше її фраз у першому метелику, то частіше вона говорить; ніколи двічі поспіль
  function pickKin(O) {
    const c = KIN.map(() => 0);
    for (const R of O.rows) for (const pc of R.pieces) if (pc.pi >= 0) c[KIN_OF[pc.pi]]++;
    const w = c.map((n, k) => (k === kin || !n ? 0 : Math.sqrt(n)));
    let r = Math.random() * w.reduce((a, b) => a + b, 0), k = 0;
    while (k < w.length - 1 && (r -= w[k]) > 0) k++;
    return w[k] > 0 ? k : -1;
  }
  // а фраза-дві в ньому тим часом стають новими, яких іще ніде нема
  function bloom(O, n, t) {
    const cand = [];
    for (const R of O.rows) {
      if (R.hide) continue;
      for (const pc of R.pieces) if (pc.pi >= 0 && t >= (pc.busy || 0)) cand.push([R, pc]);
    }
    shuffle(cand);
    let placed = 0;
    for (let pass = 0; pass < 2 && placed < n; pass++) {
      for (const [R, pc] of cand) {
        if (placed >= n) break;
        if (t < (pc.busy || 0)) continue;
        const pi = takePhrase(i => canFit(cellsOf(PH[i]) + 2, pc.len), t);
        if (pi < 0) continue;
        const np = fitPiece(pi, pc.len);
        if (pass === 0 && np.slack > 12) { letGo([np], t, 0); continue; }   // спершу туди, де фраза заповнить місце
        pc.busy = t + 3;
        later(t + placed * 0.12, now => {
          if (R.pieces.includes(pc)) decodeInto(R, pc, np, now);
          else letGo([np], now, 0);
        });
        placed++;
      }
    }
    return placed;
  }
  // подих: раз на кілька секунд одна родина мов світиться, а фраза-дві в першому метелику стають новими
  function onBreath(t) {
    breathT = t;
    nextBreath = t + rand(2.2, 2.9) * (1 - 0.35 * arousal);
    const O = host(t);
    kin = O ? pickKin(O) : -1;
    if (O) bloom(O, Math.random() < 0.75 ? 1 : 2, t);
  }

  function takeoff(t) {   // злітає: летить углиб, тож меншає, і хилиться в польоті
    const f = BF.fl;
    BF.mode = 'fly';
    Object.assign(f, { x: cx, y: cy, z: Z_HOME, vx: 0, vy: -SPEED * 0.4, vz: 0, flutter: 0.5, glideOn: false, nextGlide: t + rand(4, 7) });
    f.wx = clamp(cx + (Math.random() < 0.5 ? -1 : 1) * W * 0.22, W * 0.15, W * 0.85);
    f.wy = cy - H * 0.12;
    f.wz = 0.3;
    f.wUntil = t + 6;
    BF.bakeWant = true;
    BF.nextHome = t + T.home0 - T.fly0;
    planMates(t);
  }
  function planMates(t) {   // скільки нових метеликів і коли кожен народиться
    const n = tall() ? 4 : clamp(Math.round((W * H) / 260000), 4, 5);
    FLOCK = [];
    for (let i = 0; i < n; i++) {
      const F = mate(i);
      F.at = t + T.hatch0 - T.fly0 + i * T.gap + rand(-0.6, 0.6);
      FLOCK.push(F);
    }
  }
  // новий метелик народжується з коду: довколишні літери злітають і по спіралі збігаються в точку,
  // спалах — і він, тріпочучи, розгортає крила
  function hatch(F, t) {
    const f = F.fl, m = Math.min(W, H), others = [BF, ...FLOCK].filter(G => G !== F && G.mode !== 'wait');
    let bx = W / 2, by = H / 2, bd = -1;
    for (let k = 0; k < 16; k++) {   // там, де довкола найбільше вільного місця
      const x = rand(W * 0.16, W * 0.84), y = rand(H * 0.24, H * 0.84);
      let d = m;
      for (const G of others) d = Math.min(d, Math.hypot(G.fl.x - x, G.fl.y - y));
      if (d > bd) { bd = d; bx = x; by = y; }
    }
    Object.assign(f, { x: bx, y: by, vx: 0, vy: 0, vz: 0, z: rand(0.35, 0.6), rot: 0, flutter: 1 });
    f.k = depthK(f.z);
    F.t0 = t;
    F.mode = 'egg';
    F.a = 0;
    const first = ED.list.length ? ED.list[0].id : 0, R0 = m * 0.3, cand = [];
    for (const L of ED.list) {   // літери коду довкола: кожна злітає зі свого місця
      const Y = ED.top0 + (L.id - first) * CH + ED.y + CH / 2;
      if (Math.abs(Y - by) > R0) continue;
      for (let c = 0; c < L.vis; c++) {
        if (L.cps[c] === ' ') continue;
        const X = ED.left0 + (c + 0.5) * CW, d = Math.hypot(X - bx, Y - by);
        if (d > R0 * 0.3 && d < R0) cand.push([X, Y, L.cps[c], L.cls[c]]);
      }
    }
    for (const [X, Y, u, cls] of shuffle(cand).slice(0, 40)) {   // засвічується на місці, тоді летить по спіралі
      sparks.push({ u, cls, x0: X, y0: Y, F, t0: t + rand(0, 0.35), dur: rand(1.2, 1.38), ang: rand(0.8, 1.5) * (F.i % 2 ? 1 : -1) });
    }
  }

  /* ---------- дотики: торк — кільце світла, злітає слово, а метелики поруч сахаються; утримання — вони злітаються до пальця ---------- */
  cv.addEventListener('pointerdown', e => {
    ptr.down = true;
    ptr.id = e.pointerId;
    ptr.t0 = clock;
    ptr.sx = e.clientX;
    ptr.sy = e.clientY;
    ptr.trail = 0;
    ptr.nextFloat = clock + 0.45;
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* захоплення необов'язкове */ }
    addRipple(e.clientX, e.clientY, 1);
    scramble(e.clientX, e.clientY, 28, clock, 0.7);
    addFloater(e.clientX, e.clientY);
    startle(e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', e => {
    if (!ptr.down) {
      if (e.pointerType === 'mouse') scramble(e.clientX, e.clientY, 14, clock, 0.2);
      return;
    }
    if (e.pointerId !== ptr.id) return;
    const d = Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy);
    ptr.sx = e.clientX;
    ptr.sy = e.clientY;
    if (d < 1) return;
    scramble(e.clientX, e.clientY, 20, clock, 0.5);
    ptr.trail += d;
    if (ptr.trail > 120) { ptr.trail = 0; addRipple(e.clientX, e.clientY, 0.5); }
  });
  const release = e => { if (e.pointerId === ptr.id) { ptr.down = false; ptr.id = -1; } };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  cv.addEventListener('lostpointercapture', release);

  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => resize(false), 150);
  });

  /* ---------- старт, щойно прийде шрифт коду (або після короткого очікування без нього) ---------- */
  const fontBold = `700 16px ${MONO}`;
  function fontReady() {
    const link = document.querySelector('link[href*="JetBrains"]');
    const sheet = link && !link.sheet
      ? new Promise(r => { link.addEventListener('load', r, { once: true }); link.addEventListener('error', r, { once: true }); })
      : Promise.resolve();
    const font = sheet.then(() => (document.fonts
      ? Promise.all([document.fonts.load(fontBold, 'AaЯя0{}'), document.fonts.load(`500 16px ${MONO}`, 'AaЯя0{}')])
      : null));
    return Promise.race([font, new Promise(r => setTimeout(r, 1600))]).catch(() => {});
  }
  function begin() {
    if (started) return;
    started = true;
    fontOK = !document.fonts || document.fonts.check(fontBold);
    glowSprite = makeGlow();
    resize(true);
    if (RM) {   // менше руху: перший метелик на своєму місці, решта вже тут, усі спокійні
      edStatic();
      formedAt = clock;
      progress = 1;
      nextBreath = clock + 1.5;
      nextRewrite = clock + rand(12, 20);
      for (const R of BF.rows) R.forming = false;
      calmFlock(clock);
    }
    requestAnimationFrame(frame);
  }
  if (document.fonts) {
    // шрифт прийшов пізно: редактор уже набрав ним текст; перемальовуємо ним і фігури, не починаючи спочатку
    document.fonts.addEventListener('loadingdone', () => {
      if (!started || fontOK || !document.fonts.check(fontBold)) return;
      fontOK = true;
      const before = CW;
      edMeasure();
      edGeo();
      if (Math.abs(ED.ch - before) > before * 0.03) { resize(true); return; }
      measureGrid();
      CW = before;
      spriteCache.clear();
      makeAtlas();
      for (const R of rows) later(clock, () => { setBase(R); R.dirty = true; });
      for (const F of FLOCK) if (F.baked) later(clock, () => { F.cache = bake(F, false); });
      if (BF.cache) BF.bakeWant = true;
    });
  }
  fontReady().then(begin, begin);
})();
</script>
</body>
</html>
